global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: rag-api-local
    metrics_path: /internal/metrics-prometheus
    static_configs:
      - targets:
          - host.docker.internal:8000
