name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest python-jose[cryptography]

      - name: Build demo knowledge base
        run: python run_backtest.py --offline
        env:
          ENABLE_RERANK: "false"
          HF_ENDPOINT: https://hf-mirror.com

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
        env:
          ENABLE_RERANK: "false"

      - name: Run RAG backtest (offline)
        run: python run_backtest.py --offline
        env:
          ENABLE_RERANK: "false"
