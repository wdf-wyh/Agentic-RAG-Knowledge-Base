name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest python-jose[cryptography]

      - name: Prepare demo documents
        run: |
          mkdir -p documents
          cp -r data/demo_documents/. documents/

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short
        env:
          ENABLE_RERANK: "false"
          PYTHONPATH: .

      # 离线 BM25 回测：不下载 HuggingFace 嵌入模型，避免 hf-mirror 网络失败
      - name: Run RAG backtest (offline)
        run: python run_backtest.py --offline
        env:
          ENABLE_RERANK: "false"
